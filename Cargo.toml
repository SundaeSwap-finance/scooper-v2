[package]
name = "scooper-v2"
description = "Server for Sundae Scooper"
version = "0.7.15"
edition = "2024"
repository = "https://github.com/SundaeSwap-finance/scooper-v2"
license-file = "LICENSE"
publish = false

[dependencies]
acropolis_common = { version = "0.3.0", git = "https://github.com/SundaeSwap-finance/acropolis.git", rev = "f190e70cd4a8dedd0a76f576ff02029159ef0899" }
acropolis_module_block_unpacker = { version = "0.2.0", git = "https://github.com/SundaeSwap-finance/acropolis.git", rev = "f190e70cd4a8dedd0a76f576ff02029159ef0899" }
acropolis_module_custom_indexer = { version = "0.1.0", git = "https://github.com/SundaeSwap-finance/acropolis.git", rev = "f190e70cd4a8dedd0a76f576ff02029159ef0899" }
acropolis_module_genesis_bootstrapper = { version = "0.1.0", git = "https://github.com/SundaeSwap-finance/acropolis.git", rev = "f190e70cd4a8dedd0a76f576ff02029159ef0899" }
acropolis_module_mithril_snapshot_fetcher = { version = "0.1.0", git = "https://github.com/SundaeSwap-finance/acropolis.git", rev = "f190e70cd4a8dedd0a76f576ff02029159ef0899" }
acropolis_module_peer_network_interface = { version = "0.2.0", git = "https://github.com/SundaeSwap-finance/acropolis.git", rev = "f190e70cd4a8dedd0a76f576ff02029159ef0899" }
anyhow = "1"
bech32 = "0.11"
async-trait = "0.1"
caryatid_sdk = { version = "0.14.1", git = "https://github.com/input-output-hk/caryatid.git", rev = "538c3f8" }
caryatid_process = { version = "0.14.3", git = "https://github.com/input-output-hk/caryatid.git", rev = "538c3f8" }
chrono = "0.4"
clap = { version = "4.5.41", features = ["derive"] }
config = "0.15.11"
hex = { version = "0.4", features = ["serde"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
minicbor = { version = "0.26", features = ["alloc", "derive"] }
num-bigint = "0.4.6"
num-traits = "0.2.19"
pallas-addresses = "1.5.0-rc.1"
pallas-codec = "1.5.0-rc.1"
pallas-crypto = "1.5.0-rc.1"
pallas-primitives = { version = "1.5.0-rc.1", features = ["unstable"] }
pallas-network = "1.5.0-rc.1"
pallas-traverse = { version = "1.5.0-rc.1", features = ["unstable"] }
reqwest = { version = "0.13", features = ["rustls", "json"], default-features = false }
rustls-pemfile = "2"
url = "2"
# SundaeSwap-finance/plutus-parser#12 (pallas 1.5 support), until it is released.
plutus-parser = { git = "https://github.com/SundaeSwap-finance/plutus-parser.git", rev = "f1558044fc9ef5eba29c52a47bd16f888a48e8b8", default-features = false, features = ["derive", "pallas-v1_5"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "tls-rustls"] }
thiserror = "2"
tokio = { version = "1.46.1", features = ["full"] }
tokio-rustls = "0.26"
tokio-util = "0.7"
uplc-turbo = { package = "amaru-uplc", version = "0.4", git = "https://github.com/pragma-org/amaru.git", rev = "34a453005bcaaf837ee73bd996b99eab8ef92961" }
amaru-kernel = { git = "https://github.com/pragma-org/amaru.git", rev = "34a453005bcaaf837ee73bd996b99eab8ef92961" }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "std",
  "json",
] }

# plutus-parser takes pallas-primitives 1.5.0-rc.1 from the txpipe git tag (crates.io 1.x
# and 1.5 cannot coexist, txpipe/pallas#850): pull the crates.io copies used by acropolis
# and scooper from the same tag, so that everyone shares a single `PlutusData` type.
[patch.crates-io]
pallas-codec = { git = "https://github.com/txpipe/pallas", tag = "v1.5.0-rc.1" }
pallas-crypto = { git = "https://github.com/txpipe/pallas", tag = "v1.5.0-rc.1" }
pallas-primitives = { git = "https://github.com/txpipe/pallas", tag = "v1.5.0-rc.1" }

[dev-dependencies]
proptest = "1"
tokio = { version = "1.46.1", features = ["full", "test-util"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[package.metadata.dist]
dist = true
