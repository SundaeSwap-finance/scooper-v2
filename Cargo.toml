[package]
name = "scooper-v2"
description = "Server for Sundae Scooper"
version = "0.7.16"
edition = "2024"
repository = "https://github.com/SundaeSwap-finance/scooper-v2"
license-file = "LICENSE"
publish = false

[dependencies]
acropolis_common = { version = "0.3.0", git = "https://github.com/SundaeSwap-finance/acropolis.git", branch = "fetch_certified_eb" }
acropolis_module_block_unpacker = { version = "0.2.0", git = "https://github.com/SundaeSwap-finance/acropolis.git", branch = "fetch_certified_eb" }
acropolis_module_custom_indexer = { version = "0.1.0", git = "https://github.com/SundaeSwap-finance/acropolis.git", branch = "fetch_certified_eb" }
acropolis_module_genesis_bootstrapper = { version = "0.1.0", git = "https://github.com/SundaeSwap-finance/acropolis.git", branch = "fetch_certified_eb" }
acropolis_module_mithril_snapshot_fetcher = { version = "0.1.0", git = "https://github.com/SundaeSwap-finance/acropolis.git", branch = "fetch_certified_eb" }
acropolis_module_peer_network_interface = { version = "0.2.0", git = "https://github.com/SundaeSwap-finance/acropolis.git", branch = "fetch_certified_eb" }
anyhow = "1"
bech32 = "0.11"
async-trait = "0.1"
caryatid_sdk = { version = "0.14.1", git = "https://github.com/input-output-hk/caryatid.git", rev = "538c3f8" }
caryatid_process = { version = "0.14.3", git = "https://github.com/input-output-hk/caryatid.git", rev = "538c3f8" }
chrono = "0.4"
clap = { version = "4.5.41", features = ["derive"] }
config = "0.15.11"
hex = { version = "0.4", features = ["serde"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
minicbor = { version = "0.26", features = ["alloc", "derive"] }
num-bigint = "0.4.6"
num-traits = "0.2.19"
pallas-addresses = "1.5.0-rc.2"
pallas-codec = "1.5.0-rc.2"
pallas-crypto = "1.5.0-rc.2"
pallas-primitives = { version = "1.5.0-rc.2", features = ["unstable"] }
pallas-network = { version = "1.5.0-rc.2", features = ["unstable"] }
# Not used directly: acropolis pulls it, and it must follow pallas-network's
# `unstable` or its matches on the network types stop being exhaustive.
pallas-hardano = { version = "1.5.0-rc.2", features = ["unstable"] }
pallas-traverse = { version = "1.5.0-rc.2", features = ["unstable"] }
reqwest = { version = "0.13", features = ["rustls", "json"], default-features = false }
rustls-pemfile = "2"
url = "2"
# SundaeSwap-finance/plutus-parser#12 (pallas 1.5 support), until it is released.
plutus-parser = { git = "https://github.com/SundaeSwap-finance/plutus-parser.git", branch = "dijkstra", default-features = false, features = ["derive", "pallas-v1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "tls-rustls"] }
thiserror = "2"
tokio = { version = "1.46.1", features = ["full"] }
tokio-rustls = "0.26"
tokio-util = "0.7"
uplc-turbo = { package = "amaru-uplc", version = "0.4", git = "https://github.com/pragma-org/amaru.git", rev = "34a453005bcaaf837ee73bd996b99eab8ef92961" }
amaru-kernel = { git = "https://github.com/pragma-org/amaru.git", rev = "34a453005bcaaf837ee73bd996b99eab8ef92961" }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "std",
  "json",
] }

# Sundae integration branch `leios-musashi`: txpipe/pallas#860 (Dijkstra tx rejections) and
# #846 (N2N v16, which opens the Leios mini-protocols), until they are released.
[patch.crates-io]
pallas = { git = "https://github.com/SundaeSwap-finance/pallas.git", rev = "a41ee10356105b7ebb439c505edf09f1dbed17a5" }
pallas-addresses = { git = "https://github.com/SundaeSwap-finance/pallas.git", rev = "a41ee10356105b7ebb439c505edf09f1dbed17a5" }
pallas-codec = { git = "https://github.com/SundaeSwap-finance/pallas.git", rev = "a41ee10356105b7ebb439c505edf09f1dbed17a5" }
pallas-configs = { git = "https://github.com/SundaeSwap-finance/pallas.git", rev = "a41ee10356105b7ebb439c505edf09f1dbed17a5" }
pallas-crypto = { git = "https://github.com/SundaeSwap-finance/pallas.git", rev = "a41ee10356105b7ebb439c505edf09f1dbed17a5" }
pallas-hardano = { git = "https://github.com/SundaeSwap-finance/pallas.git", rev = "a41ee10356105b7ebb439c505edf09f1dbed17a5" }
pallas-network = { git = "https://github.com/SundaeSwap-finance/pallas.git", rev = "a41ee10356105b7ebb439c505edf09f1dbed17a5" }
pallas-network2 = { git = "https://github.com/SundaeSwap-finance/pallas.git", rev = "a41ee10356105b7ebb439c505edf09f1dbed17a5" }
pallas-primitives = { git = "https://github.com/SundaeSwap-finance/pallas.git", rev = "a41ee10356105b7ebb439c505edf09f1dbed17a5" }
pallas-traverse = { git = "https://github.com/SundaeSwap-finance/pallas.git", rev = "a41ee10356105b7ebb439c505edf09f1dbed17a5" }
pallas-txbuilder = { git = "https://github.com/SundaeSwap-finance/pallas.git", rev = "a41ee10356105b7ebb439c505edf09f1dbed17a5" }
pallas-utxorpc = { git = "https://github.com/SundaeSwap-finance/pallas.git", rev = "a41ee10356105b7ebb439c505edf09f1dbed17a5" }
pallas-validate = { git = "https://github.com/SundaeSwap-finance/pallas.git", rev = "a41ee10356105b7ebb439c505edf09f1dbed17a5" }

[dev-dependencies]
proptest = "1"
tokio = { version = "1.46.1", features = ["full", "test-util"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[package.metadata.dist]
dist = true
